name: Bootstrap Rive CLI
on:
  push:
    branches:
      - codex-rive-cli-bootstrap

permissions:
  contents: read

jobs:
  package-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Download Rive CLI
        run: |
          curl -fsSL https://releases.rive.app/cli/v1.0.4/rive-linux-x64.tar.gz -o rive-linux-x64.tar.gz
          echo "a592c2ca578a5c87e20e0d5f6e1e755c64831e7cacd4e2b463ae6be675641157  rive-linux-x64.tar.gz" | sha256sum --check -
          mkdir rive-cli
          tar -xzf rive-linux-x64.tar.gz -C rive-cli
          chmod +x rive-cli/rive
      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: rive-cli-linux-x64
          path: rive-cli/rive
          if-no-files-found: error
